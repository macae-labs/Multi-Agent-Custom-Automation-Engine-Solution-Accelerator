[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-ai-evaluation==1.18.5",
    "azure-ai-inference==1.0.0b9",
    "azure-ai-projects==2.0.0",
    "azure-cosmos==4.16.4",
    "azure-identity==1.25.3",
    "azure-monitor-events-extension==0.1.0",
    "azure-monitor-opentelemetry==1.8.5",
    "azure-search-documents==12.0.0",
    "fastapi==0.141.1",
    "openai==2.16.0",
    "opentelemetry-api==1.39.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.39.0",
    "opentelemetry-exporter-otlp-proto-http==1.39.0",
    "opentelemetry-instrumentation-fastapi==0.60b0",
    "opentelemetry-instrumentation-openai==0.46.2",
    "opentelemetry-sdk==1.39.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.52.4",
    "pylint-pydantic==0.4.1",
    "pexpect==4.9.0",
    "mcp==2.2.0",
    "werkzeug==3.1.8",
    "azure-core==1.41.0",
    "agent-framework-azure-ai==1.0.0rc6",
    "agent-framework-core==1.17.0",
    "agent-framework-orchestrations==1.1.1",
    "urllib3==2.7.0",
    "protobuf==5.29.6",
    "cryptography==50.0.1",
    "aiohttp==3.14.3",
    "pyasn1==0.6.4",
    "nltk==3.10.3",
    "httpx>=0.27.0",
    "azure-keyvault-secrets>=4.11.2",
    "agent-framework-openai==1.0.0rc6",
    "azure-storage-blob>=12.30.1",
    "azure-ai-voicelive==1.3.0",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["azure.functions", "azure.monitor.events.extension"]
ignore_missing_imports = true

[tool.fastapi]
entrypoint = "app:app"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    # 1.4+: 0.24 fugaba un event loop "de repuesto" por test (destapado por el
    # gate error::ResourceWarning en pytest.ini)
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    # <0.16: la 0.16 amplió el set de reglas por defecto (+178 hallazgos);
    # se adopta vía PR de dependabot evaluando esos hallazgos, no de contrabando
    "ruff>=0.16.6,<0.17",
    "types-regex",
    "types-python-dateutil",
    "types-requests",
    # API/schema contract testing (OpenAPI/GraphQL)
    "schemathesis>=4.26.1",
    # Record/replay HTTP interactions in tests
    "pytest-recording>=0.13.4",
    # Mock httpx requests in unit tests
    "respx>=0.23.1",
    "types-pyyaml>=6.0.12.20260906",
]

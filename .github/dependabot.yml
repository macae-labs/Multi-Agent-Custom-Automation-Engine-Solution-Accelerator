# Dependabot configuration
# All PRs target main. The "auto-merge" label triggers the auto-merge workflow
# after all checks pass.
version: 2
updates:
  # GitHub Actions — monthly, grouped
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "auto-merge"
    groups:
      all-actions:
        patterns:
          - "*"

  # npm frontend — monthly, grouped
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "auto-merge"
    groups:
      npm-frontend:
        patterns:
          - "*"

  # Python backend — monthly, grouped
  # "uv", no "pip": el contrato es pyproject+uv.lock; el ecosistema pip
  # editaría requirements.txt (artefacto exportado) sin tocar el lock.
  - package-ecosystem: "uv"
    directory: "/src/backend"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "auto-merge"
    ignore:
      # Dependabot security runs for this repo can target starlette even when
      # the resolved version in metadata is already non-vulnerable, which
      # produces a security_update_not_needed failure.
      - dependency-name: "starlette"
    groups:
      python-backend:
        patterns:
          - "*"

  # Python MCP server — monthly, grouped
  - package-ecosystem: "uv"
    directory: "/src/mcp_server"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "auto-merge"
    groups:
      python-mcp:
        patterns:
          - "*"

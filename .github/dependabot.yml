# Dependabot configuration
# All PRs target main. The "auto-merge" label triggers the auto-merge workflow
# after all checks pass.
version: 2
updates:
  # GitHub Actions — monthly, grouped
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "auto-merge"
    groups:
      all-actions:
        patterns:
          - "*"

  # npm frontend — monthly, grouped
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    # lockfile-only: package-lock se mueve dentro de los rangos de package.json.
    # Sin esto Dependabot reescribía "typescript": "5.1.6" a 7.0.2 y react ^18
    # a 19 en el mismo PR, y npm install ya no resolvía.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "auto-merge"
    groups:
      npm-frontend:
        patterns:
          - "*"

  # Python backend — monthly, grouped
  # "uv", no "pip": el contrato es pyproject+uv.lock; el ecosistema pip
  # editaría requirements.txt (artefacto exportado) sin tocar el lock.
  - package-ecosystem: "uv"
    directory: "/src/backend"
    # lockfile-only: Dependabot mueve uv.lock DENTRO de los rangos que declara
    # pyproject.toml y nunca reescribe el manifiesto. El manifiesto es la
    # política de compatibilidad (rangos hasta el siguiente major; las líneas
    # en migración manual, fijas); los majors se adoptan editando pyproject.
    # Con "increase" (el default) Dependabot reescribía pines y topes y
    # proponía 98 bumps a la vez, agent-framework 1.18 incluido.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "auto-merge"
    # Sin `ignore`: un ignore incondicional apaga también las correcciones de
    # seguridad de esa dependencia. Que un job de seguridad termine en
    # `security_update_not_needed` no es un fallo que arreglar aquí.
    groups:
      python-backend:
        patterns:
          - "*"

  # Servidor Python del frontend (uvicorn que sirve el build de React).
  # La imagen instala requirements.txt (Dockerfile), así que ese es el
  # artefacto a mantener: ecosistema pip, no uv.
  - package-ecosystem: "pip"
    directory: "/src/frontend"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "auto-merge"
    groups:
      python-frontend-server:
        patterns:
          - "*"

  # Infra vscode_web (requirements.txt + endpoint-requirements.txt): sin
  # entrada, las alertas de ansible-core no tenían quién las cerrara.
  - package-ecosystem: "pip"
    directory: "/infra/vscode_web"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "auto-merge"
    groups:
      infra-vscode-web:
        patterns:
          - "*"

  # Python MCP server — monthly, grouped
  - package-ecosystem: "uv"
    directory: "/src/mcp_server"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    target-branch: "main"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "auto-merge"
    groups:
      python-mcp:
        patterns:
          - "*"
